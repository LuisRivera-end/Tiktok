[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veta-api"
version = "0.1.0"
description = "API escolar de Veta: feed, telemetría, recomendación y subasta de anuncios"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "greenlet>=3.1.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.12",
  "motor>=3.6.0",
  "numpy>=2.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: pruebas sin bases de datos",
]

[tool.setuptools.packages.find]
include = ["app*"]
